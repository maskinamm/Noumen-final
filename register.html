<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Зарегистрируйтесь, чтобы сохранять любимые цитаты, создавать свою коллекцию и делиться вдохновением с друзьями." />
  <meta name="keywords" content="регистрация, создать аккаунт, новый пользователь" />
  <meta name="author" content="Ноумен" />
  <meta name="robots" content="noindex, nofollow" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
  <body>
    <header>
      <div class="container-fluid px-3 px-md-4">
        <nav class="navbar navbar-expand-lg navbar-light">
          <a class="navbar-brand" href="index.html">
            <img src="./img/LOGOTRUE.svg" alt="Логотип Ноумен" width="160" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
           <ul class="navbar-nav ms-auto" id="mainNav">
  <li class="nav-item">
    <a class="nav-link" href="index.html">Главная</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="about.html">О нас</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="suggest.html">Предложить цитату</a>
  </li>
  <li class="nav-item" id="profileLink">
    <a class="nav-link" href="profile.html">Личный кабинет</a>
  </li>
  <li class="nav-item" id="loginLink">
    <a class="nav-link active" href="login.html">Вход</a>
  </li>
  <li class="nav-item" id="logoutLink" style="display: none;">
    <a class="nav-link" href="#" id="logoutNavBtn">Выйти</a>
  </li>
</ul>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <div class="register-container">
        <div class="register-card">
          <div class="register-card-body">
            <h1 class="register-title">Регистрация</h1>

            <!-- Исправлено: убран action="profile.html" -->
            <form id="registerForm">
              <div class="register-form-group">
                <label for="email" class="register-label"
                  >Электронная почта</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="register-input"
                  placeholder="example@mail.com"
                />
              </div>

              <div class="register-form-group">
  <label for="nickname" class="register-label">Никнейм (необязательно)</label>
  <input type="text" id="nickname" name="nickname" class="register-input" placeholder="Как вас называть">
</div>

              <div class="register-form-group">
                <label for="password" class="register-label">Пароль</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="register-input"
                  placeholder="Введите пароль"
                />
              </div>

              <div class="register-form-group">
                <label for="confirm_password" class="register-label"
                  >Подтверждение пароля</label
                >
                <input
                  type="password"
                  id="confirm_password"
                  name="confirm_password"
                  class="register-input"
                  placeholder="Повторите пароль"
                />
                <div id="passwordError" class="register-error-message"></div>
              </div>

              <button type="submit" class="register-btn">
                Зарегистрироваться
              </button>
            </form>

            <div class="register-login-link">
              Уже есть аккаунт?
              <a href="login.html">Войдите</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <p>© Все права защищены, «Ноумен», 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
