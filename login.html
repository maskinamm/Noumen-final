  <header>
    <div class="container-fluid px-3 px-md-4">
      <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="index.html">
         <img src="./img/LOGOTRUE.svg" alt="Логотип Ноумен" width="160">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="mainNav">
  <li class="nav-item">
    <a class="nav-link" href="index.html">Главная</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="about.html">О нас</a>

  <main>
    <div class="login-container">
      <div class="login-card">
        <div class="login-card-body">
          <h1 class="login-title">Авторизация</h1>

          <!-- Исправлено: убран action="profile.html" -->
          <form id="loginForm">
            <div class="login-form-group">
              <label for="email" class="login-label">Электронная почта</label>
              <input type="email" id="email" name="email" class="login-input" placeholder="example@mail.com">
            </div>

            <div class="login-form-group">
              <label for="password" class="login-label">Пароль</label>
              <input type="password" id="password" name="password" class="login-input" placeholder="Введите пароль">
            </div>

            <button type="submit" class="login-btn">Войти</button>
          </form>

          <div class="login-register-link">
            Нет аккаунта?
            <a href="register.html">Регистрация</a>
          </div>
        </div>
      </div>
    </div>
